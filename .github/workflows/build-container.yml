name: Build container image
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/armandris/no_spoil_alert:sha-${{ env.SHORT_SHA }}
            ghcr.io/armandris/no_spoil_alert:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Debug action outputs
        run: |
          echo "Digest output: '${{ steps.build.outputs.digest }}'"
          echo "ImageID output: '${{ steps.build.outputs.imageid }}'"
          echo "Metadata output: '${{ steps.build.outputs.metadata }}'"

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: server_ssh
    steps:
      - name: Debug - Print received digest
        run: |
          echo "Raw digest from job output:"
          echo "${{ needs.build-and-push.outputs.digest }}"
          echo ""
          echo "Length: ${#DIGEST_VAR}"
        env:
          DIGEST_VAR: ${{ needs.build-and-push.outputs.digest }}

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ubuntu@54.241.201.248 << 'EOF'
          echo "Pulling exact image: ghcr.io/armandris/no_spoil_alert@$IMAGE_DIGEST"
          sudo podman pull ghcr.io/armandris/no_spoil_alert@$IMAGE_DIGEST
          echo "Restarting container..."
          sudo systemctl restart no_spoil_alert.service
          echo "Deploy complete!"
          EOF

