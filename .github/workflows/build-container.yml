name: Build container image
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/armandris/no_spoil_alert:sha-${{ env.SHORT_SHA }}
            ghcr.io/armandris/no_spoil_alert:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Debug - Check if SSH_KNOWN_HOSTS is loaded
        run: |
          echo "KNOWN_HOSTS length: ${#KNOWN_HOSTS}"
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "🚨 ERROR: SSH_KNOWN_HOSTS is empty or not available!"
            exit 1
          else
            echo "✅ SSH_KNOWN_HOSTS is present (length: ${#KNOWN_HOSTS} chars)"
          fi
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ubuntu@54.241.201.248 << EOF
          echo "Pulling exact image: ghcr.io/armandris/no_spoil_alert@$IMAGE_DIGEST"
          sudo podman pull ghcr.io/armandris/no_spoil_alert@$IMAGE_DIGEST
          echo "Restarting container..."
          sudo systemctl restart no_spoil_alert.container
          echo "Deploy complete!"
          EOF

