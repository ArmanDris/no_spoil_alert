name: Build container image
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/armandris/no_spoil_alert:sha-${{ env.SHORT_SHA }}
            ghcr.io/armandris/no_spoil_alert:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: server_ssh
    steps:
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SHORT SHA: $SHORT_SHA"

          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ubuntu@54.241.201.248 << 'EOF'
          echo "Deploying no_spoil_alert with tag: sha-$SHORT_SHA"

          export NO_SPOIL_ALERT_TAG=sha-$SHORT_SHA

          cd ~/

          docker compose pull no_spoil_alert

          docker compose up -f server_compose.yml up -d --no-deps --wait --force-recreate no_spoil_alert

          docker system prune -f --volumes

          echo "Deploy complete! Using image: sha-$SHORT_SHA"
          EOF


