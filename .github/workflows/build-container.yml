name: Build container image
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/armandris/no_spoil_alert:sha-${{ env.SHORT_SHA }}
            ghcr.io/armandris/no_spoil_alert:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: server_ssh
    steps:
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "IMAGE DIGEST: $IMAGE_DIGEST"

          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ec2-user@52.9.243.29 "NO_SPOIL_ALERT_DIGEST=$IMAGE_DIGEST bash -s" << 'EOF'
          set -euo pipefail
          env | grep NO_SPOIL_ALERT_DIGEST

          echo "Deploying ghcr.io/armandris/no_spoil_alert@$NO_SPOIL_ALERT_DIGEST"

          docker compose -f ~/server_compose.yml pull no_spoil_alert

          docker compose -f ~/server_compose.yml up -d --no-deps --force-recreate --wait no_spoil_alert

          docker image prune -f

          echo "Deployment complete!"
          EOF
